[package]
name = "ic_vote_poll"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

# Kept deliberately small. Every dependency here is source a build reviewer
# (T3 in THREAT_MODEL.md) has to read or vouch for, and the reviewers are the
# thing standing between the module hash and "the reviewed code". A dependency
# is a permanent tax on that review, so V0 adds none it can avoid: no stable
# structures (state is one candid-serializable struct), no serde_json, and
# exactly two cryptographic dependencies: sha2, and ed25519-dalek for the
# in-ballot signature that replaced caller-binding (THREAT_MODEL.md 2.7).
# dalek is the ecosystem-standard implementation with years of adversarial
# review; hand-rolling Ed25519 to avoid the dependency would swap reviewed
# code for unreviewed code, which is the opposite of the point.
[dependencies]
ic-cdk = "0.20"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false }
